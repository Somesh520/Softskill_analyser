name: Deploy infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            REPO_DIR=""
            for base in "$HOME" /home/* /opt /srv /var/www; do
              if [ -z "$base" ] || [ ! -d "$base" ]; then
                continue
              fi

              for name in soft-skill-analyser soft-skill Softskill_analyser Softskill Soft-skill; do
                candidate="$base/$name"
                if [ -d "$candidate/.git" ]; then
                  REPO_DIR="$candidate"
                  break 2
                fi
              done
            done

            if [ -z "$REPO_DIR" ]; then
              echo "Repo not found. Searching common deployment locations..."
              REPO_DIR="$(find /home /opt /srv /var/www -maxdepth 4 -type d -name .git 2>/dev/null | sed 's#/.git$##' | grep -Ei 'soft-skill|softskill|softskill_analyser' | head -n 1 || true)"
            fi

            if [ -z "$REPO_DIR" ]; then
              echo "No repository found in common deployment locations."
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main

            cd Backend
            npm install --include=dev

            if pm2 show Backend >/dev/null 2>&1; then
              pm2 restart Backend
            else
              pm2 start server.js --name Backend
            fi
