name: Deploy infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            REPO_DIR=""
            for candidate in "$HOME/soft-skill-analyser" "$HOME/soft-skill"; do
              if [ -d "$candidate/.git" ]; then
                REPO_DIR="$candidate"
                break
              fi
            done

            if [ -z "$REPO_DIR" ]; then
              echo "No repository found in $HOME. Expected soft-skill or soft-skill-analyser."
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main

            cd Backend
            npm install --include=dev

            if pm2 show Backend >/dev/null 2>&1; then
              pm2 restart Backend
            else
              pm2 start server.js --name Backend
            fi
